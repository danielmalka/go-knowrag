name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # golangci-lint is not preinstalled on the runner, and `make lint` calls it directly.
      # Installed by exact version so CI lints with the same binary as the developer machine.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make test

  eval-golden-hermetic:
    runs-on: ubuntu-latest
    if: false # TODO(S10): enable once `cli eval --golden` runs against the versioned synthetic
              # fixture (docs/PRD-stories-servico.md §3 S10). Never runs against real vaults/Qdrant here.
    steps:
      - run: echo "not implemented until S10"

  eval-isolation-hermetic:
    runs-on: ubuntu-latest
    if: false # TODO(S11): enable once `cli eval --isolation` runs against the synthetic
              # multi-tenant fixture (docs/PRD-stories-servico.md §3 S11).
    steps:
      - run: echo "not implemented until S11"
