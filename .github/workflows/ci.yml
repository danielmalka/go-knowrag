name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # golangci-lint is not preinstalled on the runner, and `make lint` calls it directly.
      # Installed by exact version so CI lints with the same binary as the developer machine.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make lint
      # Beside the linter because it is the same kind of check: static, fast, and about a property
      # nobody notices losing. It reads deploy/docker-compose.yml and needs no infrastructure.
      - run: make verify-deploy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make test

  # The two gates below run on every push. Both used to be switched off by a job condition that was
  # constantly false, under a TODO naming S10 and S11 — the failure mode this repository catalogues
  # at length: a check that reports nothing every time is indistinguishable from a check that is
  # passing, and it stays that way on the push that breaks it.
  #
  # What they run against today is a command whose harness does not exist, so they report pending
  # rather than red — a permanently failing gate is one everybody learns to scroll past. The
  # distinction is made by scripts/ci/eval-gate.sh, which fails on every outcome except that one,
  # and the pending branch stops being taken by itself the day the harness lands. Neither job needs
  # a TODO, because neither has anything left to remember.
  eval-golden-hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Hermetic, as the job name claims. `--corpus` makes the golden gate search a versioned
      # synthetic file instead of the Qdrant collection, so this opens no connection, needs no
      # embedding service and no GPU, and never touches a real vault — the guarantee is the code
      # path cmd/cli/eval.go takes, not this runner's environment.
      #
      # --min-recall is the exact number this fixture produces, not a slack threshold.
      # TestHermeticGoldenGate_FixtureCorpus_AchievesExpectedRecall (internal/eval/hermetic_test.go)
      # asserts the same number AND reads this line, so a fixture edit that moves the recall fails
      # `make test` instead of quietly relaxing the gate here.
      - run: >
          ./scripts/ci/eval-gate.sh golden
          --file testdata/eval/hermetic/golden-set.yaml
          --corpus testdata/eval/hermetic/corpus.yaml
          --min-recall 0.75

  eval-isolation-hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # S11 fills the harness behind `--isolation` against a synthetic multi-tenant fixture
      # (docs/PRD-stories-servico.md §3 S11).
      - run: ./scripts/ci/eval-gate.sh isolation
