name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # golangci-lint is not preinstalled on the runner, and `make lint` calls it directly.
      # Installed by exact version so CI lints with the same binary as the developer machine.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make lint
      # Beside the linter because it is the same kind of check: static, fast, and about a property
      # nobody notices losing. It reads deploy/docker-compose.yml and needs no infrastructure.
      - run: make verify-deploy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make test

  # The two gates below run on every push. Both used to be switched off by a job condition that was
  # constantly false, under a TODO naming S10 and S11 — the failure mode this repository catalogues
  # at length: a check that reports nothing every time is indistinguishable from a check that is
  # passing, and it stays that way on the push that breaks it.
  #
  # Both measure. That was not always true: they used to run against a command with no harness and
  # report pending rather than red, because a permanently failing gate is one everybody learns to
  # scroll past. scripts/ci/eval-gate.sh still makes that distinction, and the list of modes allowed
  # to answer "pending" is now empty — so every failure here is a failure. The branch stays for the
  # case that created it, a mode added before its harness is written.
  eval-golden-hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Two things have to hold, and the two steps below check one each. Both are here, in this job,
      # rather than one of them living in `make test` and this job being meaningful only because
      # that job also exists — a green check named `eval-golden-hermetic` has to mean what its name
      # says on its own. Reorganise the jobs tomorrow and a protection that lived somewhere else
      # would vanish with nothing here to notice.
      #
      # THE FIXTURE: 6 hits out of 8. Asserted exactly, because the threshold below cannot see it —
      # deleting the two deliberately-unanswerable questions from golden-set.yaml takes recall to
      # 1.0, which clears the floor and would otherwise leave this job green over an emptied
      # fixture. This test also reads the --min-recall value below and fails if the two disagree.
      - run: go test -run TestHermetic ./internal/eval/

      # THE THRESHOLD: recall must be at least --min-recall. A floor and not an equality, because
      # that is what a recall gate means — a build that retrieves better must not be failed for it.
      #
      # `--corpus` is what makes this hermetic: the golden gate searches a versioned synthetic file
      # instead of the Qdrant collection, so nothing here opens a connection, needs an embedding
      # service or a GPU, or touches a real vault. The guarantee is the code path cmd/cli/eval.go
      # takes (openEvalSearcher), not this runner's environment.
      - run: >
          ./scripts/ci/eval-gate.sh golden
          --file testdata/eval/hermetic/golden-set.yaml
          --corpus testdata/eval/hermetic/corpus.yaml
          --min-recall 0.75

  eval-isolation-hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Hermetic, as the job name claims: the isolation suite builds its own corpus and drives the
      # real internal/retrieval path against it, so this opens no Qdrant connection, needs no
      # embedder and reads no vault. It does read the source tree, for the architecture-boundary
      # case — actions/checkout above is what provides it.
      #
      # This is a release gate: one failing case fails the job (PRD §2.7 NFR-3, pass/fail with no
      # middle ground).
      - run: ./scripts/ci/eval-gate.sh isolation
